name: Backend CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - profile-service
          - swipe-service
          - feed-service
          - chat-service
          - notification-service
          - api-gateway

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make gradlew executable
        working-directory: ./${{ matrix.service }}
        run: chmod +x ./gradlew

      - name: Start Infrastructure (Docker Compose)
        if: matrix.service != 'api-gateway'
        working-directory: ./
        run: |
          docker compose up -d
          sleep 25

      - name: Wait for services (Notification Service)
        if: matrix.service == 'notification-service'
        run: |
          echo "Waiting extra time for Kafka and other services..."
          sleep 15

      - name: Check Code Style (Spotless)
        working-directory: ./${{ matrix.service }}
        run: ./gradlew spotlessCheck

      - name: Build and Test
        working-directory: ./${{ matrix.service }}
        run: ./gradlew build --stacktrace --continue

      - name: Upload Test Reports (if failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.service }}
          path: ./${{ matrix.service }}/build/reports/tests/
          retention-days: 7

      - name: Show Docker Logs on Failure
        if: failure()
        run: docker compose logs
        working-directory: ./

  build-and-publish:
    name: Publish ${{ matrix.service }}
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - profile-service
          - swipe-service
          - feed-service
          - chat-service
          - notification-service
          - api-gateway

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make gradlew executable
        working-directory: ./${{ matrix.service }}
        run: chmod +x ./gradlew

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=sha,format=short
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}